<style> 
:root{--bg:#0B0E13;--card:#13171F;--border:#1C2231;--accent:#D4882E;--txt:#E4E8EE;--muted:#5F7088;--bull:#1EC964;--bear:#E84057} 
*{margin:0;padding:0;box-sizing:border-box} 
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden} 
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 10% 40%,rgba(212,136,46,.035) 0%,transparent 55%),radial-gradient(ellipse at 90% 80%,rgba(30,201,100,.02) 0%,transparent 50%)} 
::-webkit-scrollbar{width:5px;height:5px} 
::-webkit-scrollbar-track{background:var(--bg)} 
::-webkit-scrollbar-thumb{background:#252d3a;border-radius:3px} 

.ticker-bar{background:linear-gradient(90deg,#080a0f,#10141c,#080a0f);border-bottom:1px solid var(--border);overflow:hidden;white-space:nowrap} 
.ticker-scroll{display:inline-block;animation:tScroll 50s linear infinite} 
@keyframes tScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}} 

.search-dd{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:.7rem;max-height:350px;overflow-y:auto;z-index:200;display:none;box-shadow:0 20px 60px rgba(0,0,0,.6)} 
.search-dd.open{display:block} 
.sdd-item{padding:.6rem .9rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background .12s;border-bottom:1px solid rgba(28,34,49,.5);font-size:.88rem} 
.sdd-item:hover{background:rgba(212,136,46,.08)} 

.tab-b{padding:.55rem 1rem;border-radius:.5rem;cursor:pointer;color:var(--muted);font-weight:500;transition:all .18s;border:none;background:0 0;font-family:'Outfit',sans-serif;font-size:.85rem;white-space:nowrap} 
.tab-b:hover{color:var(--txt);background:rgba(255,255,255,.03)} 
.tab-b.on{color:var(--accent);background:rgba(212,136,46,.1)} 

.tc{display:none;animation:fu .3s ease} 
.tc.on{display:block} 
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}} 

.mc{background:var(--card);border:1px solid var(--border);border-radius:.85rem;padding:1.1rem;transition:all .22s} 
.mc:hover{border-color:rgba(212,136,46,.25);box-shadow:0 6px 20px rgba(0,0,0,.25)} 

.sr{width:100%;border-collapse:separate;border-spacing:0} 
.sr th{background:rgba(255,255,255,.025);padding:.6rem .7rem;text-align:left;font-weight:600;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;transition:color .15s} 
.sr th:hover{color:var(--accent)} 
.sr td{padding:.55rem .7rem;border-bottom:1px solid rgba(28,34,49,.4);font-size:.85rem;white-space:nowrap} 
.sr tr:hover td{background:rgba(255,255,255,.015)} 
.sr .hi{color:var(--bull);font-weight:700} 
.sr .lo{color:var(--bear);font-weight:600} 

.si{background:rgba(255,255,255,.035);border:1px solid var(--border);border-radius:.5rem;padding:.45rem .65rem;color:var(--txt);font-family:'Outfit',sans-serif;font-size:.85rem;width:100%;outline:0;transition:border-color .15s} 
.si:focus{border-color:var(--accent)} 
select.si{cursor:pointer} 
select.si option{background:var(--card);color:var(--txt)} 

.bp{background:linear-gradient(135deg,var(--accent),#b87020);color:#fff;padding:.55rem 1.3rem;border-radius:.5rem;border:none;cursor:pointer;font-family:'Outfit',sans-serif;font-weight:600;font-size:.85rem;transition:all .18s;box-shadow:0 4px 14px rgba(212,136,46,.22)} 
.bp:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(212,136,46,.32)} 

.pill{font-size:.72rem;padding:.3rem .7rem;border-radius:1rem;border:1px solid var(--border);color:var(--muted);cursor:pointer;background:0 0;font-family:'Outfit',sans-serif;transition:all .15s;white-space:nowrap} 
.pill:hover,.pill.on{color:var(--accent);border-color:var(--accent);background:rgba(212,136,46,.08)} 

.heat-cell{border-radius:4px;padding:6px 8px;font-size:.72rem;font-weight:600;text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s;min-width:85px} 
.heat-cell:hover{transform:scale(1.08);box-shadow:0 4px 15px rgba(0,0,0,.4);z-index:2;position:relative} 

.score-ring{transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)} 
.bk-bar{height:7px;border-radius:4px;background:rgba(255,255,255,.05);overflow:hidden} 
.bk-fill{height:100%;border-radius:4px;transition:width .7s ease} 

.toast-c{position:fixed;top:4.5rem;right:1rem;z-index:999;display:flex;flex-direction:column;gap:.4rem} 
.toast{background:var(--card);border:1px solid var(--border);border-radius:.65rem;padding:.6rem 1rem;box-shadow:0 8px 25px rgba(0,0,0,.45);animation:tin .25s ease,tout .25s ease 2.5s forwards;font-size:.85rem;display:flex;align-items:center;gap:.4rem} 
@keyframes tin{from{opacity:0;transform:translateX(25px)}to{opacity:1;transform:translateX(0)}} 
@keyframes tout{to{opacity:0;transform:translateX(25px)}} 

@media(max-width:768px){.sr th,.sr td{padding:.4rem .5rem;font-size:.78rem}.tab-b{padding:.4rem .7rem;font-size:.78rem}} 
@media(prefers-reduced-motion:reduce){.ticker-scroll{animation:none}.tc{animation:none}} 
</style> 
</head>

const STOCKS = [];
for(let sector in NAMES) {
    const cfg = SC[sector];
    const rand = function(arr) { return (Math.random() * (arr[1] - arr[0]) + arr[0]); };
    NAMES[sector].forEach(function(s) {
        STOCKS.push({
            name: s[0], ticker: s[1], sector: sector,
            pe: rand(cfg.pe).toFixed(1),
            pb: rand(cfg.pb).toFixed(2),
            roe: rand(cfg.roe).toFixed(1),
            mcap: (rand(cfg.mcapR)/1000).toFixed(0),
            chg: (Math.random() * 6 - 2).toFixed(2)
        });
    });
}

document.querySelectorAll('#tabs .tab-b').forEach(function(btn) {
    btn.onclick = function() {
        document.querySelectorAll('.tab-b').forEach(function(b) { b.classList.remove('on'); });
        document.querySelectorAll('.tc').forEach(function(c) { c.classList.remove('on'); });
        btn.classList.add('on');
        document.getElementById('p-' + btn.dataset.t).classList.add('on');
    };
});

let tHtml = '';
STOCKS.slice(0, 30).forEach(function(s) {
    const cls = parseFloat(s.chg) >= 0 ? 'text-bull' : 'text-bear';
    const sign = parseFloat(s.chg) >= 0 ? '+' : '';
    tHtml += '<span class="mx-4">' + s.ticker + ' <span class="' + cls + '">' + sign + s.chg + '%</span></span>';
});
document.getElementById('tickEl').innerHTML = tHtml + tHtml;

const dashEl = document.getElementById('p-dash');
let dHtml = '<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5"><div class="mc"><p class="text-muted text-xs uppercase mb-1">Total Stocks</p><h2 class="text-3xl font-bold text-accent">' + STOCKS.length + '</h2></div><div class="mc"><p class="text-muted text-xs uppercase mb-1">Sectors Covered</p><h2 class="text-3xl font-bold text-accent">' + Object.keys(SC).length + '</h2></div><div class="mc"><p class="text-muted text-xs uppercase mb-1">Data Period</p><h2 class="text-3xl font-bold text-accent">FY2024</h2></div></div>';
dHtml += '<div class="mc"><h3 class="text-lg font-bold mb-4">Top Gainers (Mock Data)</h3><div class="overflow-x-auto"><table class="sr"><thead><tr><th>Stock</th><th>Sector</th><th>P/E</th><th>ROE</th><th>Change</th></tr></thead><tbody>';
STOCKS.sort(function(a,b){return b.chg-a.chg;}).slice(0,5).forEach(function(s) {
    dHtml += '<tr><td><div class="font-semibold">' + s.name + '</div><div class="text-[.7rem] text-muted">' + s.ticker + '</div></td><td>' + s.sector + '</td><td>' + s.pe + '</td><td>' + s.roe + '%</td><td class="' + (parseFloat(s.chg)>=0?'hi':'lo') + '">' + s.chg + '%</td></tr>';
});
dHtml += '</tbody></table></div></div>';
dashEl.innerHTML = dHtml;

const scrEl = document.getElementById('p-screener');
let sHtml = '<div class="mc mb-4 flex gap-3 flex-wrap items-center"><input type="text" placeholder="Min ROE %" class="si max-w-[120px]" id="fMinRoe"><button class="bp" onclick="filterScr()">Apply Filter</button></div>';
sHtml += '<div class="mc"><div class="overflow-x-auto"><table class="sr"><thead><tr><th>Stock</th><th>Sector</th><th>Mcap (Cr)</th><th>P/E</th><th>P/B</th><th>ROE</th></tr></thead><tbody id="scrBody">';
STOCKS.forEach(function(s) {
    sHtml += '<tr><td><div class="font-semibold">' + s.name + '</div><div class="text-[.7rem] text-muted">' + s.ticker + '</div></td><td>' + s.sector + '</td><td>' + s.mcap + '</td><td>' + s.pe + '</td><td>' + s.pb + '</td><td>' + s.roe + '%</td></tr>';
});
sHtml += '</tbody></table></div></div>';
scrEl.innerHTML = sHtml;

window.filterScr = function() {
    const minRoe = parseFloat(document.getElementById('fMinRoe').value) || 0;
    let bodyHtml = '';
    STOCKS.filter(function(s) { return parseFloat(s.roe) >= minRoe; }).forEach(function(s) {
        bodyHtml += '<tr><td><div class="font-semibold">' + s.name + '</div><div class="text-[.7rem] text-muted">' + s.ticker + '</div></td><td>' + s.sector + '</td><td>' + s.mcap + '</td><td>' + s.pe + '</td><td>' + s.pb + '</td><td>' + s.roe + '%</td></tr>';
    });
    document.getElementById('scrBody').innerHTML = bodyHtml;
};

document.getElementById('p-sector').innerHTML = '<div class="mc"><h3 class="text-xl font-bold mb-2">Sector Analysis</h3><p class="text-muted">Detailed sector breakdown will appear here.</p></div>';
document.getElementById('p-stock').innerHTML = '<div class="mc"><h3 class="text-xl font-bold mb-2">Stock Microscope</h3><p class="text-muted">Search for a stock above to see deep fundamental analysis.</p></div>';
document.getElementById('p-ranks').innerHTML = '<div class="mc"><h3 class="text-xl font-bold mb-2">Market Rankings</h3><p class="text-muted">Top performers across the Nifty 500 will be listed here.</p></div>';
document.getElementById('p-heat').innerHTML = '<div class="mc"><h3 class="text-xl font-bold mb-2">Sector Heatmap</h3><p class="text-muted">Visual heatmap of market movements will render here.</p></div>';

const sinp = document.getElementById('sinp');
const sdd = document.getElementById('sdd');
sinp.oninput = function() {
    const q = sinp.value.toLowerCase();
    if(!q){ sdd.classList.remove('open'); return; }
    const res = STOCKS.filter(function(s) { return s.name.toLowerCase().includes(q) || s.ticker.toLowerCase().includes(q); }).slice(0, 10);
    if(res.length === 0){ sdd.classList.remove('open'); return; }
    sdd.innerHTML = res.map(function(s) { return '<div class="sdd-item" onclick="document.getElementById(\'sinp\').value=\'' + s.ticker + '\';document.getElementById(\'sdd\').classList.remove(\'open\');"><span>' + s.name + '</span><span class="text-muted text-xs">' + s.ticker + '</span></div>'; }).join('');
    sdd.classList.add('open');
};
document.addEventListener('click', function(e) {
    if(!document.getElementById('swrap').contains(e.target)) sdd.classList.remove('open');
});
</script>
